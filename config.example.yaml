# starkeep configuration. The first-run setup (`starkeep doctor`) creates your
# local config.yaml; this file documents every key. Your real config.yaml is
# gitignored and written with mode 600 — never commit credentials.
#
# The uniform rule: secrets go in the environment (LASTFM_API_KEY,
# SUBSONIC_PASSWORD), behavior keys go here. A saved config.yaml contains
# only what differs from the defaults; `starkeep config` shows the effective
# values. This file is the reference — you do not copy it, you read it.

# Last.fm
lastfm_user: ""            # scrobble history is read from this user
lastfm_api_key: ""         # prefer the LASTFM_API_KEY env var instead of storing it here

# Subsonic / Navidrome
subsonic_url: "http://localhost:4533"
subsonic_user: ""
subsonic_password: ""      # or set SUBSONIC_PASSWORD in the environment instead
                           # (recommended: a dedicated, non-admin Navidrome user)
# Token auth is computed per request; no md5 password setting is needed.

# Paths (absolute)
incoming_dir: ""           # audition folder; ONLY place downloads land.
                           # Must be visible to Navidrome so you can star tracks.
library_dir: ""            # promote target root; only ever added to, never
                           # deleted from. Must NOT live inside incoming_dir.
state_file: ""             # e.g. /var/lib/starkeep/state.json
log_dir: ""                # one log file per day

# Behavior
cap: 30                    # candidates per run
expiry_days: 7             # audition lifetime: an unstarred candidate is deleted
                           # at the next cleaning run once it is this old
                           # (default rhythm: Monday -> next Monday)
expiry_runs: 0             # 0 = pure day-based lifetime above. > 0 = cleaning-
                           # cycle budget: an unstarred candidate expires after
                           # this many cleaning passes, and only if it was
                           # heard (see min_plays). Promotion passes
                           # (`run --no-expire`) never delete and never
                           # consume a budget.
min_plays: 1               # Navidrome playCount >= this counts as "heard"
carry_over_runs: 1         # extra cleaning passes granted while playCount < min_plays
similar_per_seed: 3        # similar tracks per seed (scrobbled) track
max_strikes: 2             # download failures before a candidate is abandoned
harvest_days: 7            # scrobble window feeding the harvest; `run --since
                           # YYYY-MM-DD` widens it for one pass
requeue_after_days: 0      # days before an expired candidate may be harvested
                           # again (rhythm-based, ignores the scheduler);
                           # 0 = expired candidates are never proposed again
blacklist_file: ""         # manual blocklist, see blacklist.py; empty = use
                           # blacklist.txt next to this file when it exists
downloader: "ytdlp"        # only 'ytdlp' in v1
audio_format: "m4a"        # m4a, mp3, opus, flac, ... — or "native" to keep the
                           # stream exactly as YouTube serves it (no re-encode;
                           # see README for the audio-quality trade-offs)
playlist_name: "Starkeep Audition"
                           # the playlist starkeep manages (delete + recreate
                           # every run). Players pin it by this name; if you
                           # rename it, the previous playlist is orphaned on
                           # the server and must be deleted by hand.
playlist_icon: "https://raw.githubusercontent.com/unknown-Ric/starkeep/main/starkeep-logo.png"
                           # cover for the Starkeep Audition playlist
                           # (Navidrome-native, auth with the subsonic account).
                           # Substitute: any PNG/JPEG/WEBP/GIF/SVG URL (SVG is
                           # rasterized to PNG automatically, needs cairosvg).
                           # Remove: "" disables the cover upload.

# Cron monitoring (healthchecks.io style): a successful `run` GETs this URL,
# a failed one GETs <url>/fail. Empty = disabled.
ping_url: ""
