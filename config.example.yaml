# starkeep configuration. The first-run setup (`starkeep doctor`) creates your
# local config.yaml; this file documents every key. Your real config.yaml is
# gitignored and written with mode 600 — never commit credentials.

# Last.fm
lastfm_user: ""            # scrobble history is read from this user
lastfm_api_key: ""         # prefer the LASTFM_API_KEY env var instead of storing it here

# Subsonic / Navidrome
subsonic_url: "http://localhost:4533"
subsonic_user: ""
subsonic_password: ""
# Token auth is computed per request; no md5 password setting is needed.

# Paths (absolute)
incoming_dir: ""           # audition folder; ONLY place downloads land.
                           # Must be visible to Navidrome so you can star tracks.
library_dir: ""            # promote target root; only ever added to, never
                           # deleted from. Must NOT live inside incoming_dir.
state_file: ""             # e.g. /var/lib/starkeep/state.json
log_dir: ""                # one log file per day

# Behavior
cap: 30                    # candidates per run
expiry_days: 14            # unstarred audition lifetime; expired tracks are
                           # never recommended again (permanent reject)
similar_per_seed: 3        # similar tracks per seed (scrobbled) track
max_strikes: 2             # download failures before a candidate is abandoned
downloader: "ytdlp"        # only 'ytdlp' in v1
audio_format: "m4a"        # m4a, mp3, opus, flac, ...
