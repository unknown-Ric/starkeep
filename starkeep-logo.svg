<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="starkeep logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2a6e"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#f29a3a"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </radialGradient>
  </defs>

  <!-- app-icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- record -->
  <circle cx="256" cy="256" r="200" fill="url(#vinyl)"/>

  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2">
    <circle cx="256" cy="256" r="132"/>
    <circle cx="256" cy="256" r="152"/>
    <circle cx="256" cy="256" r="172"/>
  </g>
  <!-- outer groove fades away: the audition tracks that expire -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.14"
          stroke-width="3" stroke-linecap="round" stroke-dasharray="90 18 40 18 16 18 6 18 2 400"/>

  <!-- sheen -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
    <path d="M 86.9 194.4 A 180 180 0 0 1 166 100.1"/>
    <path d="M 346 411.9 A 180 180 0 0 0 425.1 317.6"/>
  </g>

  <!-- gold label -->
  <circle cx="256" cy="256" r="100" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- the star: star it to keep it -->
  <path d="M256 192 L273.05 232.54 L316.87 236.22 L283.58 264.96 L293.62 307.78 L256 285 L218.38 307.78 L228.42 264.96 L195.13 236.22 L238.95 232.54 Z"
        fill="#1a1630" stroke="#1a1630" stroke-width="12" stroke-linejoin="round"/>
</svg>
