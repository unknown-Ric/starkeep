[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starkeep"
version = "0.1.0"
description = "Cron-powered music discovery for Navidrome: weekly Last.fm-backed candidates, star a track to keep it, everything else expires."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
starkeep = "starkeep.cli:main"

[tool.setuptools]
packages = ["starkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
